# Server: the app uses Plesk's PostgreSQL and Redis on localhost, and Plesk's nginx forwards
# the domain to 127.0.0.1:3000. The "postgres" service is only for local development.

services:
  app:
    build:
      context: .
      # The build renders static pages from the database on the server's localhost.
      network: host
      secrets:
        - env
    # Shares the server's network: reaches PostgreSQL and Redis on localhost and listens on
    # 127.0.0.1:3000 only (see the Dockerfile), never the internet.
    network_mode: host
    env_file: .env
    environment:
      REDIS_URL: redis://localhost:6379
    volumes:
      - ./media:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  # One-off commands (migrations, seeders): docker compose run --rm tools pnpm seed
  tools:
    build:
      context: .
      target: deps
      # Downloads packages through the server's own network (Plesk's firewall doesn't touch it).
      network: host
    network_mode: host
    env_file: .env
    volumes:
      - ./media:/app/media
    profiles: [tools]

  redis:
    image: redis:7-alpine
    # Cache only: capped, oldest entries dropped when full, nothing saved to disk.
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - 127.0.0.1:6379:6379
    restart: unless-stopped

  # Local development only (docker compose up -d postgres). Never started on the server.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    profiles: [local]

secrets:
  env:
    file: .env
